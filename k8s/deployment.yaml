apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-ui
  labels:
    app.kubernetes.io/name: payroll-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payroll-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payroll-ui
    spec:
      containers:
        - name: payroll-ui
          image: payroll-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
